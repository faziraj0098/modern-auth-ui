<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <title> Login &  Registration Form </title>
</head>
<body>

    <div class="container">

        <!-- ============ Curve Shapes ============ -->

        <div class="curve-shape"></div>
        <div class="curve-shape2"></div>

         <!-- ============ Login Form ============ -->

        <div class="form-box login">
            <h2 class="animation" style="--D:0; --s:21">Login</h2>
            <form action="#">
                <div class="input-box animation" style="--D:1; --s:22">
                    <input type="text" id="username" required>
                    <label>Username</label>
                    <i class='bx bxs-user'></i>
                </div>

                <div class="input-box animation" style="--D:2; --s:23">
                    <input type="password" id="password" required>
                    <label>Password</label>
                    <i class='bx bxs-lock-alt'></i>
                </div>

                <button class="btn" type="submit">Login</button>
                <div class="regi-link animation" style="--D:3; --s:24">
                    <p>Don't have an account? <a href="#" class="signup-link">Sign Up</a></p>
                </div>
            </form>
        </div>

        <div class="info-content login">
            <h2 class="animation"  style="--D:4 --s:25">WELCOME BACK!</h2>
            <p class="animation" style="--D:5 --s:26">We missed you! Please login to your account.</p>
        </div>

         <!-- ============ Register Form ============ -->

        <div class="form-box regi">
            <h2 class="animation" style="--li:17; --s:0;">Register</h2>
            <form action="#">
                <div class="input-box animation" style="--li:18; --s:1;">
                    <input type="text" id="signup-username" required>
                    <label>Username</label>
                    <i class='bx bxs-user'></i>
                </div>

                <div class="input-box animation" style="--li:18; --s:1;">
                    <input type="email" id="signup-email" required>
                    <label>Email</label>
                    <i class='bx bxs-envelope'></i>
                </div>

                <div class="input-box animation" style="--li:19; --s:2;">
                    <input type="password" id="signup-password" required>
                    <label>Password</label>
                    <i class='bx bxs-lock-alt'></i>
                </div>

                <button class="btn" type="submit">Register</button>
                <div class="regi-link animation" style="--li:20; --s:3;">
                    <p class="animation" style="--li:17; --s:4;">Already have an account? <a href="#" class="login-link">Sign In</a></p>
                </div>

            </form>
        </div>

        <div class="info-content regi">
            <h2 class="animation" style="--li:21; --s:0;">JOIN US NOW!</h2>
            <p class="animation" style="--li:22; --s:1;">Start your journey with us by creating a new account.</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
